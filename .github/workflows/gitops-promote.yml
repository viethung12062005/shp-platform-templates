# Reusable workflow: update the image digest in the GitOps repo. The actual DEPLOY is done by Argo CD.
# Approval gate: the job below uses the GitHub Environment `deploy-<env>` (a job that calls a reusable workflow cannot declare an environment).
name: gitops-promote
on:
  workflow_call:
    inputs:
      service: { type: string, required: true }
      environment: { type: string, required: true, description: "uat or prod" }
      digest: { type: string, required: true, description: "sha256:..." }
      gitops-owner: { type: string, required: true, description: "Owner (user/org) of the GitOps repo" }
      gitops-repo: { type: string, required: true, description: "GitOps repo name (without owner)" }
      gitops-app-id: { type: string, required: true, description: "ID of the bot GitHub App (not a secret)" }
      mode: { type: string, default: pr, description: "pr: open a Pull Request; commit: commit straight to main (uat only)" }
    secrets:
      gitops-app-private-key: { required: true }
permissions:
  contents: read
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: deploy-${{ inputs.environment }}
    steps:
      - name: Validate inputs
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          DIGEST: ${{ inputs.digest }}
          SERVICE: ${{ inputs.service }}
          MODE: ${{ inputs.mode }}
        run: |
          [[ "$ENVIRONMENT" =~ ^(uat|prod)$ ]] || { echo "environment must be uat or prod"; exit 1; }
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "invalid digest"; exit 1; }
          [[ "$SERVICE" =~ ^[a-z0-9-]+$ ]] || { echo "invalid service name"; exit 1; }
          [[ "$MODE" =~ ^(pr|commit)$ ]] || { echo "mode must be pr or commit"; exit 1; }
          if [ "$ENVIRONMENT" = prod ] && [ "$MODE" = commit ]; then echo "prod must always go through a PR"; exit 1; fi
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        id: app
        with:
          app-id: ${{ inputs.gitops-app-id }}
          private-key: ${{ secrets.gitops-app-private-key }}
          owner: ${{ inputs.gitops-owner }}
          repositories: ${{ inputs.gitops-repo }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ inputs.gitops-owner }}/${{ inputs.gitops-repo }}
          token: ${{ steps.app.outputs.token }}
          persist-credentials: true
      - name: Update digest
        env:
          FILE: envs/${{ inputs.environment }}/${{ inputs.service }}/values.yaml
          DIGEST: ${{ inputs.digest }}
        run: |
          [ -f "$FILE" ] || { echo "$FILE not found in the GitOps repo"; exit 1; }
          yq -i '.image.digest = strenv(DIGEST)' "$FILE"
          git diff --stat
      - name: Commit and push
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SERVICE: ${{ inputs.service }}
          ENVIRONMENT: ${{ inputs.environment }}
          DIGEST: ${{ inputs.digest }}
          MODE: ${{ inputs.mode }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "shp-gitops-bot"
          git config user.email "shp-gitops-bot@users.noreply.github.com"
          short="${DIGEST#sha256:}"; short="${short:0:12}"
          msg="promote($ENVIRONMENT): $SERVICE -> $short (from $SOURCE_SHA)"
          git add -A
          git diff --cached --quiet && { echo "No changes (digest already applied)"; exit 0; }
          if [ "$MODE" = commit ]; then
            git commit -m "$msg"
            git push origin HEAD:main
          else
            branch="promote/$ENVIRONMENT/$SERVICE/$short"
            git checkout -b "$branch"
            git commit -m "$msg"
            git push origin "$branch"
            gh pr create --title "$msg" --body "Update the image digest of \`$SERVICE\` for environment \`$ENVIRONMENT\`. Needs review before merge." --base main --head "$branch"
          fi
