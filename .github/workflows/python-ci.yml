# Reusable workflow: CI cho service Python (FastAPI, ML).
name: python-ci
on:
  workflow_call:
    inputs:
      working-directory: { type: string, required: true }
      python-version: { type: string, default: "3.12" }
      coverage-threshold: { type: number, default: 70 }
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.working-directory }}/pyproject.toml
      - name: Cài phụ thuộc
        run: python -m pip install -e ".[dev]"
      - name: Lint và format
        run: |
          ruff check .
          ruff format --check .
      - name: Kiểm kiểu
        run: mypy .
      - name: Test + coverage
        env:
          THRESHOLD: ${{ inputs.coverage-threshold }}
        run: pytest --cov --cov-fail-under="$THRESHOLD"
      - name: Quét lỗ hổng phụ thuộc
        run: pip-audit
