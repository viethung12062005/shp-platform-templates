# Reusable workflow: CI cho service Python (FastAPI, ML).
name: python-ci
on:
  workflow_call:
    inputs:
      working-directory: { type: string, required: true }
      python-version: { type: string, default: "3.12" }
      coverage-threshold: { type: number, default: 70 }
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.working-directory }}/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy .
      - name: Test + coverage
        env:
          THRESHOLD: ${{ inputs.coverage-threshold }}
        run: pytest --cov --cov-fail-under="$THRESHOLD"
      - name: Dependency vulnerability scan
        run: pip-audit
