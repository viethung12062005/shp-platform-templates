# CI for the templates repo itself: validates the workflows and the chart.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/pr-checks.yml
    secrets: inherit   # passes NVD_API_KEY (if set) to the OWASP Dependency-Check job
    permissions:
      contents: read
      pull-requests: read
  chart:
    uses: ./.github/workflows/helm-validate.yml
    with:
      chart-path: charts/microservice
