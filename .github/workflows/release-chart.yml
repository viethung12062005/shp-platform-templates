# Publish the chart to ACR (OCI) when a chart-vX.Y.Z tag is pushed. Signs in to Azure with OIDC (identity chart-push;
# the Environment release-chart only accepts chart-v* tags, set in the repo settings).
name: release-chart
on:
  push:
    tags: ["chart-v*"]
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/helm-validate.yml
    with:
      chart-path: charts/microservice
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-chart
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with: { version: v3.19.0 }
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_CHART_PUSH }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Package and push the chart
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#chart-v}"
          helm package charts/microservice --version "$version" --app-version "$version"
          token=$(az acr login --name "$ACR_NAME" --expose-token --output tsv --query accessToken)
          echo "$token" | helm registry login "$ACR_NAME.azurecr.io" --username 00000000-0000-0000-0000-000000000000 --password-stdin
          helm push "microservice-$version.tgz" "oci://$ACR_NAME.azurecr.io/helm"
