# Reusable workflow: CI for Java modules (Maven multi-module in the application repo, ADR-0015).
# Runs the same command developers run locally: mvn -pl <modules> -am verify  ->  Spotless check, compile -Werror, tests (Testcontainers), JaCoCo >= threshold.
name: java-ci
on:
  workflow_call:
    inputs:
      modules:
        type: string
        required: true
        description: "Comma-separated list of Maven modules, e.g. services/scheduling or libs/java/shp-authz,libs/java/shp-web"
      java-version: { type: string, default: "21" }
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
      - name: Validate inputs
        env:
          MODULES: ${{ inputs.modules }}
        run: |
          [[ "$MODULES" =~ ^[a-z0-9/_.,-]+$ ]] || { echo "invalid modules"; exit 1; }
      - name: Maven verify (format, build -Werror, test, coverage)
        env:
          MODULES: ${{ inputs.modules }}
        run: mvn -B --no-transfer-progress -pl "$MODULES" -am verify
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          retention-days: 7
