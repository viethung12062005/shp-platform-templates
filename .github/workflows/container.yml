# Reusable workflow: build image -> lint Dockerfile -> vulnerability scan -> SBOM -> (when push=true) push to ACR + cosign signature.
# Signs in to Azure with OIDC (no secrets). Output: the image digest.
name: container
on:
  workflow_call:
    inputs:
      context: { type: string, required: true }
      dockerfile: { type: string, default: Dockerfile }
      image-name: { type: string, required: true, description: "Repository name in ACR, e.g. scheduling" }
      push: { type: boolean, default: false }
      acr-name: { type: string, default: "" }
      azure-client-id: { type: string, default: "" }
      azure-tenant-id: { type: string, default: "" }
      azure-subscription-id: { type: string, default: "" }
    outputs:
      digest:
        description: "sha256 digest of the pushed image"
        value: ${{ jobs.build.outputs.digest }}
permissions:
  contents: read
env:
  # Trivy runs from an image pinned by digest (version 0.58.1); no third-party action is used.
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write   # OIDC for Azure and keyless cosign
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ inputs.context }}/${{ inputs.dockerfile }}
          failure-threshold: warning
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (load into local Docker for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          load: true
          pull: true   # luôn kéo base image mới nhất: cache GHA không được giữ bản distroless cũ còn lỗi đã vá
          tags: scan/${{ inputs.image-name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vulnerability scan (block fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress \
            "scan/${{ inputs.image-name }}:${{ github.sha }}"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: scan/${{ inputs.image-name }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
      - name: Sign in to Azure (OIDC)
        if: inputs.push
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ inputs.azure-client-id }}
          tenant-id: ${{ inputs.azure-tenant-id }}
          subscription-id: ${{ inputs.azure-subscription-id }}
      - name: Sign in to ACR
        if: inputs.push
        run: az acr login --name "${{ inputs.acr-name }}"
      - name: Push image to ACR
        id: push
        if: inputs.push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: true
          tags: ${{ inputs.acr-name }}.azurecr.io/${{ inputs.image-name }}:${{ github.sha }}
          cache-from: type=gha
          provenance: true
          sbom: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: inputs.push
      - name: Sign image and attach SBOM (keyless cosign)
        if: inputs.push
        env:
          IMAGE: ${{ inputs.acr-name }}.azurecr.io/${{ inputs.image-name }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE"
