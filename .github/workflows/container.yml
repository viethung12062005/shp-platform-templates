# Reusable workflow: build image → lint Dockerfile → quét lỗ hổng → SBOM → (khi push=true) đẩy lên ACR + ký cosign.
# Đăng nhập Azure bằng OIDC (không có secret). Kết quả: digest của image.
name: container
on:
  workflow_call:
    inputs:
      context: { type: string, required: true }
      dockerfile: { type: string, default: Dockerfile }
      image-name: { type: string, required: true, description: "Tên repo trong ACR, ví dụ scheduling" }
      push: { type: boolean, default: false }
      acr-name: { type: string, default: "" }
      azure-client-id: { type: string, default: "" }
      azure-tenant-id: { type: string, default: "" }
      azure-subscription-id: { type: string, default: "" }
    outputs:
      digest:
        description: "sha256 digest của image đã đẩy"
        value: ${{ jobs.build.outputs.digest }}
permissions:
  contents: read
env:
  # Trivy chạy bằng image ghim theo digest (phiên bản 0.58.1), không dùng action bên thứ ba.
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write   # OIDC cho Azure và cosign keyless
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ inputs.context }}/${{ inputs.dockerfile }}
          failure-threshold: warning
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build (nạp vào docker cục bộ để quét)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          load: true
          tags: scan/${{ inputs.image-name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Quét lỗ hổng (chặn HIGH/CRITICAL đã có bản vá)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress \
            "scan/${{ inputs.image-name }}:${{ github.sha }}"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
        with:
          image: scan/${{ inputs.image-name }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
      - name: Đăng nhập Azure (OIDC)
        if: inputs.push
        uses: azure/login@2035af27c2cea8ff426397d10e3edb28906b51df # v2.3.1
        with:
          client-id: ${{ inputs.azure-client-id }}
          tenant-id: ${{ inputs.azure-tenant-id }}
          subscription-id: ${{ inputs.azure-subscription-id }}
      - name: Đăng nhập ACR
        if: inputs.push
        run: az acr login --name "${{ inputs.acr-name }}"
      - name: Đẩy image lên ACR
        id: push
        if: inputs.push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: true
          tags: ${{ inputs.acr-name }}.azurecr.io/${{ inputs.image-name }}:${{ github.sha }}
          cache-from: type=gha
          provenance: true
          sbom: false
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        if: inputs.push
      - name: Ký image và gắn SBOM (cosign keyless)
        if: inputs.push
        env:
          IMAGE: ${{ inputs.acr-name }}.azurecr.io/${{ inputs.image-name }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE"
