# Reusable workflow: CI for a Node/TypeScript web app (Vite + React).
# Runs the same npm scripts developers run locally: format check, lint, type check, tests with coverage, build,
# and a dependency audit. Fails on any step; coverage thresholds live in the app's vite.config.ts.
name: node-ci
on:
  workflow_call:
    inputs:
      working-directory: { type: string, required: true }
      node-version: { type: string, default: "22" }
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - name: Install dependencies (lockfile only)
        run: npm ci --no-audit --no-fund
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Type check
        run: npm run typecheck
      - name: Test + coverage
        run: npm run test -- --coverage
      - name: Build
        run: npm run build
      - name: Dependency vulnerability scan (production dependencies)
        run: npm audit --omit=dev --audit-level=high
