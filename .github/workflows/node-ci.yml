# Reusable workflow: CI for a Node/TypeScript web app (Vite + React).
# Runs the same npm scripts developers run locally: format check, lint, type check, tests with coverage, build,
# and a dependency audit. Fails on any step; coverage thresholds live in the app's vite.config.ts.
name: node-ci
on:
  workflow_call:
    inputs:
      working-directory: { type: string, required: true }
      node-version: { type: string, default: "22" }
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - name: Install dependencies (lockfile only)
        run: npm ci --no-audit --no-fund
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Type check
        run: npm run typecheck
      - name: Test + coverage
        run: npm run test -- --coverage
      - name: Build
        run: npm run build
      - name: Dependency vulnerability scan (production dependencies)
        run: npm audit --omit=dev --audit-level=high
