# Reusable workflow: CI cho service .NET. Gọi từ workflow riêng của từng service (xem examples/).
name: dotnet-ci
on:
  workflow_call:
    inputs:
      working-directory: { type: string, required: true }
      dotnet-version: { type: string, default: "10.0.x" }
      coverage-threshold: { type: number, default: 70, description: "Ngưỡng line coverage (%)" }
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - name: Restore
        run: dotnet restore
      - name: Format (không sửa, chỉ kiểm)
        run: dotnet format --verify-no-changes --no-restore
      - name: Build (cảnh báo = lỗi)
        run: dotnet build --no-restore --configuration Release -warnaserror
      - name: Test + coverage
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./TestResults
      - name: Kiểm ngưỡng coverage
        env:
          THRESHOLD: ${{ inputs.coverage-threshold }}
        run: |
          python3 - <<'PY'
          import glob, os, sys, xml.etree.ElementTree as ET
          files = glob.glob("TestResults/**/coverage.cobertura.xml", recursive=True)
          if not files:
              sys.exit("Không tìm thấy coverage.cobertura.xml (project test thiếu coverlet.collector?)")
          rates = [float(ET.parse(f).getroot().get("line-rate", "0")) for f in files]
          pct = 100 * sum(rates) / len(rates)
          limit = float(os.environ["THRESHOLD"])
          print(f"Line coverage: {pct:.1f}% (ngưỡng {limit}%)")
          sys.exit(0 if pct >= limit else 1)
          PY
      - name: Quét package có lỗ hổng (gồm phụ thuộc gián tiếp)
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then echo "Có package lỗ hổng"; exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-${{ github.run_id }}
          path: ${{ inputs.working-directory }}/TestResults
          retention-days: 7
