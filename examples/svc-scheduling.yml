# VÍ DỤ workflow riêng của một service (đặt ở repo ứng dụng: .github/workflows/svc-scheduling.yml).
# Mỗi service một file như thế này; chỉ chạy khi thư mục của service thay đổi. Đã trỏ về viethung12062005; đổi phiên bản khi phát hành tag mới.
name: svc-scheduling
on:
  pull_request:
    paths: ["services/scheduling/**", "libs/java/**", "contracts/**", "pom.xml", ".github/workflows/svc-scheduling.yml"]
  push:
    branches: [main]
    paths: ["services/scheduling/**", "libs/java/**", "contracts/**", "pom.xml", ".github/workflows/svc-scheduling.yml"]
permissions:
  contents: read
jobs:
  ci:
    uses: viethung12062005/shp-platform-templates/.github/workflows/java-ci.yml@v0.1.2
    with:
      modules: services/scheduling
  container:
    needs: ci
    uses: viethung12062005/shp-platform-templates/.github/workflows/container.yml@v0.1.2
    permissions:
      contents: read
      id-token: write
    with:
      context: .
      dockerfile: services/scheduling/Dockerfile
      image-name: scheduling
      push: ${{ github.ref == 'refs/heads/main' }}
      acr-name: ${{ vars.ACR_NAME }}
      azure-client-id: ${{ vars.AZURE_CLIENT_ID_ACR_PUSH }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  promote-uat:
    if: github.ref == 'refs/heads/main'
    needs: container
    uses: viethung12062005/shp-platform-templates/.github/workflows/gitops-promote.yml@v0.1.2
    with:
      service: scheduling
      environment: uat
      digest: ${{ needs.container.outputs.digest }}
      gitops-owner: viethung12062005
      gitops-repo: shp-gitops
      gitops-app-id: ${{ vars.GITOPS_APP_ID }}
      mode: commit
    secrets:
      gitops-app-private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
  # Lên prod: workflow riêng, chỉ chạy khi demo (environment: deploy-prod, mode: pr).
