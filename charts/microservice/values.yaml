# Safe defaults. Each service overrides only what differs in the shp-gitops repo (values-<env>.yaml).
nameOverride: ""
fullnameOverride: ""

image:
  repository: ""            # required, for example <acr>.azurecr.io/scheduling
  tag: ""                   # local only; in the cloud always use a digest
  digest: ""                # sha256:... (takes precedence over tag). CI updates this value
  pullPolicy: IfNotPresent

replicaCount: 2
containerPort: 8080

# Non-sensitive environment variables (key -> value). Sensitive values go through secretEnv or keyVault.
env: {}
# Variables taken from an existing Secret: - { name: ConnectionStrings__Postgres, secretName: scheduling-db, key: connection }
secretEnv: []
config: {}                  # creates a ConfigMap and loads it with envFrom

probes:
  path: /health
  readyPath: /health/ready
  livePath: /health/live
  startup: { failureThreshold: 30, periodSeconds: 5 }
  readiness: { periodSeconds: 10, failureThreshold: 3 }
  liveness: { periodSeconds: 20, failureThreshold: 3 }

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { memory: 256Mi }

service:
  type: ClusterIP
  port: 80

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Azure Workload Identity (no secret or key). The clientId of the service's User-Assigned Managed Identity.
workloadIdentity:
  enabled: false
  clientId: ""

# Key Vault through the Secrets Store CSI driver (only for values that truly have to be secrets)
keyVault:
  enabled: false
  name: ""
  tenantId: ""
  objects: []               # - { name: db-password, type: secret }
  mountPath: /mnt/secrets

autoscaling:                # HPA on CPU
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

keda:                       # replaces HPA when scaling on a queue or schedule (NFR-S1)
  enabled: false
  minReplicaCount: 2
  maxReplicaCount: 10
  triggers: []              # raw list of KEDA triggers

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true             # denies all ingress by default, opens only what the list names
  ingressFrom: []           # - { namespaceSelector: {matchLabels: {...}}, podSelector: {matchLabels: {...}} }
  egress: []                # empty = no egress limit; fill it in to restrict (include DNS)

httpRoute:                  # Gateway API
  enabled: false
  parentRefs: []            # - { name: shp-gateway, namespace: gateway }
  hostnames: []
  pathPrefix: /
  # Several prefixes on one route (overrides pathPrefix), e.g. the API gateway: [/fhir, /api]; the web app keeps /.
  pathPrefixes: []

# Files mounted read-only into the container from a ConfigMap (<name>-files), one subPath mount per file.
# Example (web app runtime config): - { path: /usr/share/nginx/html/config.json, content: '{"authMode":"oidc"}' }
configFiles: []

topologySpread:
  enabled: true             # spread evenly across zones (NFR-A3)
  maxSkew: 1

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: { type: RuntimeDefault }

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []

# Argo Rollouts canary (enabled for prod/ml-service). When off, a plain Deployment is used.
rollout:
  enabled: false
  steps:
    - setWeight: 10
    - pause: { duration: 30s }
    - setWeight: 50
    - pause: { duration: 30s }
  analysis:
    enabled: false
    prometheusAddress: http://prometheus.monitoring:9090
    interval: 30s
    count: 3
    metrics: []             # - { name: error-rate, query: "...", successCondition: "result[0] < 0.01" }
    # true: the Rollout passes two variables, {{args.canary-hash}}/{{args.stable-hash}} (Argo Rollouts podTemplateHashValue),
    # to every query, so a new pod is compared with an old one (for example the canary error rate against stable)
    # instead of reading absolute numbers only.
    compareCanaryStable: false
