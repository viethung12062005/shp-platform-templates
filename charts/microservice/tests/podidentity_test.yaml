suite: workload identity, service account and Key Vault
templates:
  - serviceaccount.yaml
  - secretproviderclass.yaml
  - workload.yaml
release:
  name: demo
  namespace: default
set:
  image.repository: example.azurecr.io/demo
  image.tag: local
tests:
  - it: uses the fullname for the ServiceAccount
    template: serviceaccount.yaml
    asserts:
      - equal:
          path: metadata.name
          value: demo-microservice

  - it: adds the workload identity client id to the ServiceAccount when enabled
    template: serviceaccount.yaml
    set:
      workloadIdentity.enabled: true
      workloadIdentity.clientId: 00000000-0000-0000-0000-000000000000
    asserts:
      - equal:
          path: metadata.annotations
          value:
            azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"

  - it: adds the workload identity pod label and token when enabled
    template: workload.yaml
    set:
      workloadIdentity.enabled: true
      workloadIdentity.clientId: 00000000-0000-0000-0000-000000000000
    asserts:
      - equal:
          path: spec.template.metadata.labels["azure.workload.identity/use"]
          value: "true"
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true

  - it: omits the workload identity pod label when disabled
    template: workload.yaml
    asserts:
      - notExists:
          path: spec.template.metadata.labels["azure.workload.identity/use"]

  - it: fails when workload identity is enabled without a client id
    template: serviceaccount.yaml
    set:
      workloadIdentity.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: workloadIdentity.clientId is required when workloadIdentity is enabled

  - it: renders no ServiceAccount when creation is disabled
    template: serviceaccount.yaml
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: falls back to the default ServiceAccount when creation is disabled
    template: workload.yaml
    set:
      serviceAccount.create: false
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default

  - it: uses an existing ServiceAccount name when creation is disabled
    template: workload.yaml
    set:
      serviceAccount.create: false
      serviceAccount.name: external-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: external-sa

  - it: uses a custom ServiceAccount name and annotations
    template: serviceaccount.yaml
    set:
      serviceAccount.name: custom-sa
      serviceAccount.annotations:
        example.com/role: runtime
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa
      - equal:
          path: metadata.annotations
          value:
            example.com/role: runtime

  - it: renders a SecretProviderClass for the Key Vault objects
    template: secretproviderclass.yaml
    set:
      workloadIdentity.enabled: true
      workloadIdentity.clientId: 00000000-0000-0000-0000-000000000000
      keyVault.enabled: true
      keyVault.name: kv-demo
      keyVault.tenantId: 11111111-1111-1111-1111-111111111111
      keyVault.objects:
        - { name: db-password, type: secret }
    asserts:
      - isKind:
          of: SecretProviderClass
      - isAPIVersion:
          of: secrets-store.csi.x-k8s.io/v1
      - equal:
          path: metadata.name
          value: demo-microservice
      - equal:
          path: spec.provider
          value: azure
      - equal:
          path: spec.parameters.usePodIdentity
          value: "false"
      - equal:
          path: spec.parameters.clientID
          value: "00000000-0000-0000-0000-000000000000"
      - equal:
          path: spec.parameters.keyvaultName
          value: kv-demo
      - equal:
          path: spec.parameters.tenantId
          value: "11111111-1111-1111-1111-111111111111"
      - matchRegex:
          path: spec.parameters.objects
          pattern: "objectName: db-password"
      - matchRegex:
          path: spec.parameters.objects
          pattern: "objectType: secret"

  - it: defaults the Key Vault object type to secret
    template: secretproviderclass.yaml
    set:
      workloadIdentity.enabled: true
      workloadIdentity.clientId: 00000000-0000-0000-0000-000000000000
      keyVault.enabled: true
      keyVault.name: kv-demo
      keyVault.tenantId: 11111111-1111-1111-1111-111111111111
      keyVault.objects:
        - { name: db-password }
    asserts:
      - matchRegex:
          path: spec.parameters.objects
          pattern: "objectType: secret"

  - it: mounts the secrets store volume into the container
    template: workload.yaml
    set:
      workloadIdentity.enabled: true
      workloadIdentity.clientId: 00000000-0000-0000-0000-000000000000
      keyVault.enabled: true
      keyVault.name: kv-demo
      keyVault.tenantId: 11111111-1111-1111-1111-111111111111
      keyVault.objects:
        - { name: db-password, type: secret }
      keyVault.mountPath: /mnt/keyvault
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - { name: tmp, mountPath: /tmp }
            - { name: secrets-store, mountPath: /mnt/keyvault, readOnly: true }
      - equal:
          path: spec.template.spec.volumes
          value:
            - { name: tmp, emptyDir: {} }
            - name: secrets-store
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes: { secretProviderClass: demo-microservice }

  - it: renders no SecretProviderClass when Key Vault is disabled
    template: secretproviderclass.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: fails when Key Vault is enabled without a name
    template: secretproviderclass.yaml
    set:
      workloadIdentity.clientId: 00000000-0000-0000-0000-000000000000
      keyVault.enabled: true
      keyVault.tenantId: 11111111-1111-1111-1111-111111111111
    asserts:
      - failedTemplate:
          errorMessage: keyVault.name is required

  - it: fails when Key Vault is enabled without a tenant id
    template: secretproviderclass.yaml
    set:
      workloadIdentity.clientId: 00000000-0000-0000-0000-000000000000
      keyVault.enabled: true
      keyVault.name: kv-demo
    asserts:
      - failedTemplate:
          errorMessage: keyVault.tenantId is required

  - it: fails when Key Vault is enabled without a workload identity client id
    template: secretproviderclass.yaml
    set:
      keyVault.enabled: true
      keyVault.name: kv-demo
      keyVault.tenantId: 11111111-1111-1111-1111-111111111111
    asserts:
      - failedTemplate:
          errorMessage: workloadIdentity.clientId is required when using Key Vault
