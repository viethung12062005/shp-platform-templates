suite: resources, probes and pod settings
templates:
  - workload.yaml
  - configmap.yaml
  - configfiles.yaml
release:
  name: demo
  namespace: default
set:
  image.repository: example.azurecr.io/demo
  image.tag: local
tests:
  - it: renders the default probes against the health endpoints
    template: workload.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value:
            httpGet: { path: /health/ready, port: http }
            failureThreshold: 30
            periodSeconds: 5
      - equal:
          path: spec.template.spec.containers[0].readinessProbe
          value:
            httpGet: { path: /health/ready, port: http }
            failureThreshold: 3
            periodSeconds: 10
      - equal:
          path: spec.template.spec.containers[0].livenessProbe
          value:
            httpGet: { path: /health/live, port: http }
            failureThreshold: 3
            periodSeconds: 20

  - it: uses custom readiness and liveness paths and thresholds
    template: workload.yaml
    set:
      probes.readyPath: /readyz
      probes.livePath: /livez
      probes.startup: { failureThreshold: 60, periodSeconds: 2 }
      probes.readiness: { failureThreshold: 2, periodSeconds: 5 }
      probes.liveness: { failureThreshold: 4, periodSeconds: 15 }
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value:
            httpGet: { path: /readyz, port: http }
            failureThreshold: 60
            periodSeconds: 2
      - equal:
          path: spec.template.spec.containers[0].readinessProbe
          value:
            httpGet: { path: /readyz, port: http }
            failureThreshold: 2
            periodSeconds: 5
      - equal:
          path: spec.template.spec.containers[0].livenessProbe
          value:
            httpGet: { path: /livez, port: http }
            failureThreshold: 4
            periodSeconds: 15

  - it: uses the configured container port and resources
    template: workload.yaml
    set:
      containerPort: 9090
      resources:
        requests: { cpu: 250m, memory: 256Mi }
        limits: { cpu: 500m, memory: 512Mi }
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - { name: http, containerPort: 9090 }
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - { name: SERVER_PORT, value: "9090" }
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }

  - it: renders environment variables, secret references and config
    template: workload.yaml
    set:
      env:
        Logging__LogLevel__Default: Information
      secretEnv:
        - { name: ConnectionStrings__Postgres, secretName: demo-db, key: connection }
      config:
        FeatureX: "true"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - { name: SERVER_PORT, value: "8080" }
            - { name: Logging__LogLevel__Default, value: Information }
            - name: ConnectionStrings__Postgres
              valueFrom:
                secretKeyRef: { name: demo-db, key: connection }
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - configMapRef: { name: demo-microservice }
      - exists:
          path: spec.template.metadata.annotations["checksum/config"]

  - it: renders a ConfigMap from config
    template: configmap.yaml
    set:
      config:
        FeatureX: "true"
        Timeout: 30
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: demo-microservice
      - equal:
          path: data
          value:
            FeatureX: "true"
            Timeout: "30"

  - it: renders a ConfigMap for configFiles
    template: configfiles.yaml
    set:
      configFiles:
        - { path: /usr/share/nginx/html/config.json, content: '{"authMode":"oidc"}' }
        - { path: /etc/demo/extra.txt, content: hello }
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: demo-microservice-files
      - equal:
          path: data
          value:
            file-0: '{"authMode":"oidc"}'
            file-1: hello

  - it: mounts each configFiles entry as a read-only subPath
    template: workload.yaml
    set:
      configFiles:
        - { path: /usr/share/nginx/html/config.json, content: '{"authMode":"oidc"}' }
        - { path: /etc/demo/extra.txt, content: hello }
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - { name: tmp, mountPath: /tmp }
            - { name: config-files, mountPath: /usr/share/nginx/html/config.json, subPath: file-0, readOnly: true }
            - { name: config-files, mountPath: /etc/demo/extra.txt, subPath: file-1, readOnly: true }
      - equal:
          path: spec.template.spec.volumes
          value:
            - { name: tmp, emptyDir: {} }
            - name: config-files
              configMap: { name: demo-microservice-files }
      - exists:
          path: spec.template.metadata.annotations["checksum/config-files"]

  - it: fails when a configFiles entry has no content
    template: configfiles.yaml
    set:
      configFiles:
        - { path: /etc/demo/extra.txt }
    asserts:
      - failedTemplate:
          errorMessage: configFiles[].content is required

  - it: applies pod annotations, labels, node selector and tolerations
    template: workload.yaml
    set:
      podAnnotations:
        example.com/note: demo
      podLabels:
        example.com/tier: backend
      nodeSelector:
        agentpool: apps
      tolerations:
        - { key: workload, operator: Equal, value: app, effect: NoSchedule }
    asserts:
      - equal:
          path: spec.template.metadata.annotations
          value:
            example.com/note: demo
      - equal:
          path: spec.template.metadata.labels["example.com/tier"]
          value: backend
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            agentpool: apps
      - equal:
          path: spec.template.spec.tolerations
          value:
            - { key: workload, operator: Equal, value: app, effect: NoSchedule }

  - it: omits topology spread when disabled
    template: workload.yaml
    set:
      topologySpread.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.topologySpreadConstraints
