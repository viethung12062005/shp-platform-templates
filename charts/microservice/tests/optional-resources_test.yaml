suite: optional resources are absent with the default values
templates:
  - hpa.yaml
  - keda.yaml
  - httproute.yaml
  - secretproviderclass.yaml
  - analysistemplate.yaml
  - configmap.yaml
  - configfiles.yaml
release:
  name: demo
  namespace: default
set:
  image.repository: example.azurecr.io/demo
  image.tag: local
tests:
  - it: renders none of the optional resources
    asserts:
      - hasDocuments:
          count: 0
