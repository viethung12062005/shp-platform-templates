suite: Argo Rollouts
templates:
  - workload.yaml
  - analysistemplate.yaml
release:
  name: demo
  namespace: default
set:
  image.repository: example.azurecr.io/demo
  image.digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
  rollout.enabled: true
tests:
  - it: renders a Rollout with the default canary steps
    template: workload.yaml
    asserts:
      - isKind:
          of: Rollout
      - isAPIVersion:
          of: argoproj.io/v1alpha1
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.revisionHistoryLimit
          value: 3
      - equal:
          path: spec.strategy.canary.steps
          value:
            - setWeight: 10
            - pause: { duration: 30s }
            - setWeight: 50
            - pause: { duration: 30s }
      - notExists:
          path: spec.strategy.canary.analysis

  - it: renders an AnalysisTemplate when analysis is enabled
    template: analysistemplate.yaml
    set:
      rollout.analysis.enabled: true
      rollout.analysis.metrics:
        - { name: error-rate, query: "sum(rate(http_requests_total[1m]))", successCondition: "result[0] < 0.01" }
    asserts:
      - isKind:
          of: AnalysisTemplate
      - isAPIVersion:
          of: argoproj.io/v1alpha1
      - equal:
          path: metadata.name
          value: demo-microservice
      - equal:
          path: spec.metrics
          value:
            - name: error-rate
              interval: 30s
              count: 3
              failureLimit: 0
              successCondition: "result[0] < 0.01"
              provider:
                prometheus:
                  address: http://prometheus.monitoring:9090
                  query: "sum(rate(http_requests_total[1m]))"

  - it: references the AnalysisTemplate from the Rollout analysis
    template: workload.yaml
    set:
      rollout.analysis.enabled: true
      rollout.analysis.metrics:
        - { name: error-rate, query: "sum(rate(http_requests_total[1m]))", successCondition: "result[0] < 0.01" }
    asserts:
      - equal:
          path: spec.strategy.canary.analysis
          value:
            templates:
              - templateName: demo-microservice
            startingStep: 1

  - it: renders no AnalysisTemplate when analysis is disabled
    template: analysistemplate.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: passes canary and stable hashes when compareCanaryStable is set
    template: workload.yaml
    set:
      rollout.analysis.enabled: true
      rollout.analysis.compareCanaryStable: true
      rollout.analysis.metrics:
        - { name: error-rate-vs-stable, query: "sum(rate(http_requests_total[1m]))", successCondition: "result[0] <= 0.005" }
    asserts:
      - equal:
          path: spec.strategy.canary.analysis.args
          value:
            - name: canary-hash
              valueFrom: { podTemplateHashValue: Latest }
            - name: stable-hash
              valueFrom: { podTemplateHashValue: Stable }

  - it: declares the analysis arguments when compareCanaryStable is set
    template: analysistemplate.yaml
    set:
      rollout.analysis.enabled: true
      rollout.analysis.compareCanaryStable: true
      rollout.analysis.metrics:
        - { name: error-rate-vs-stable, query: "sum(rate(http_requests_total[1m]))", successCondition: "result[0] <= 0.005" }
    asserts:
      - equal:
          path: spec.args
          value:
            - name: canary-hash
            - name: stable-hash
