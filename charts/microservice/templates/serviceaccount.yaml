{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "microservice.serviceAccountName" . }}
  labels: {{- include "microservice.labels" . | nindent 4 }}
  {{- if or .Values.serviceAccount.annotations .Values.workloadIdentity.enabled }}
  annotations:
    {{- if .Values.workloadIdentity.enabled }}
    azure.workload.identity/client-id: {{ required "workloadIdentity.clientId là bắt buộc khi bật workloadIdentity" .Values.workloadIdentity.clientId | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}{{ toYaml . | nindent 4 }}{{- end }}
  {{- end }}
{{- end }}
