{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "microservice.fullname" . }}
  labels: {{- include "microservice.labels" . | nindent 4 }}
spec:
  parentRefs: {{- toYaml (required "httpRoute.parentRefs là bắt buộc" .Values.httpRoute.parentRefs) | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: {{ .Values.httpRoute.pathPrefix | quote }} }
      backendRefs:
        - { name: {{ include "microservice.fullname" . }}, port: {{ .Values.service.port }} }
{{- end }}
