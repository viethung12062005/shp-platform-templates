{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "microservice.fullname" . }}
  labels: {{- include "microservice.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "microservice.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress }}
    - Egress
    {{- end }}
  ingress:
    {{- range .Values.networkPolicy.ingressFrom }}
    - from:
        - {{- toYaml . | nindent 10 }}
      ports:
        - { port: {{ $.Values.containerPort }}, protocol: TCP }
    {{- end }}
  {{- with .Values.networkPolicy.egress }}
  egress: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
