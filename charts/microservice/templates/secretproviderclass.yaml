{{- if .Values.keyVault.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "microservice.fullname" . }}
  labels: {{- include "microservice.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ required "workloadIdentity.clientId là bắt buộc khi dùng Key Vault" .Values.workloadIdentity.clientId | quote }}
    keyvaultName: {{ required "keyVault.name là bắt buộc" .Values.keyVault.name | quote }}
    tenantId: {{ required "keyVault.tenantId là bắt buộc" .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        {{- range .Values.keyVault.objects }}
        - |
          objectName: {{ .name }}
          objectType: {{ default "secret" .type }}
        {{- end }}
{{- end }}
